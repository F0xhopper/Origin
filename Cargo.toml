[package]
name = "etymology-tui"
version = "0.1.0"
edition = "2021"
description = "A terminal-based linguistic time machine that peels modern words backward through their etymological history."
license = "MIT"
repository = "https://github.com/F0xhopper/Origin"
readme = "README.md"
keywords = ["tui", "etymology", "linguistics", "ratatui", "vim"]
categories = ["command-line-utilities"]

[[bin]]
name = "etymology-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true

[lints.clippy]
all = "warn"
